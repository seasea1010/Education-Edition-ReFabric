name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch original Forge mod
        run: |
          mkdir -p tools original-mod decompiled
          curl -L --fail -o original-mod/education_edition_reforged-1.0.4-forge-1.20.1.jar \
            https://cdn.modrinth.com/data/AgZRfe77/versions/yBO7DeLq/education_edition_reforged-1.0.4-forge-1.20.1.jar
          curl -L --fail -o tools/cfr.jar \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

      - name: Download Mojang mappings and remapper
        run: |
          curl -L --fail -o tools/version.json https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
          SERVER_MAP=$(python3 -c "import json; d=json.load(open('tools/version.json')); v=next(x for x in d['versions'] if x['id']=='1.20.1'); print(v['url'])")
          curl -L --fail -o tools/1.20.1.json "$SERVER_MAP"
          python3 -c "import json; d=json.load(open('tools/1.20.1.json')); print(d['downloads']['server_mappings']['url'])" > tools/server_url.txt
          python3 -c "import json; d=json.load(open('tools/1.20.1.json')); print(d['downloads']['client_mappings']['url'])" > tools/client_url.txt
          curl -L --fail -o tools/server.txt "$(cat tools/server_url.txt)"
          curl -L --fail -o tools/client.txt "$(cat tools/client_url.txt)"
          curl -L --fail -o tools/tiny-remapper.jar https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.14.1/tiny-remapper-0.14.1-fat.jar
          curl -L --fail -o tools/mapping-io.jar https://repo1.maven.org/maven2/net/fabricmc/mapping-io/0.8.0/mapping-io-0.8.0.jar
          cat > tools/Remap.java <<'EOF'
          import net.fabricmc.tinyremapper.*;
          import net.fabricmc.mappingio.MappingReader;
          import net.fabricmc.mappingio.MappingFormat;
          import net.fabricmc.mappingio.tree.MemoryMappingTree;
          import java.nio.file.*;
          public class Remap {
            public static void main(String[] args) throws Exception {
              Path input=Paths.get(args[0]), client=Paths.get(args[1]), server=Paths.get(args[2]), output=Paths.get(args[3]);
              MemoryMappingTree tree=new MemoryMappingTree();
              MappingReader.read(client, MappingFormat.PROGUARD_FILE, tree);
              MappingReader.read(server, MappingFormat.PROGUARD_FILE, tree);
              System.out.println("Mapping namespaces: " + tree.getSrcNamespace() + " -> " + tree.getDstNamespaces());
              String src=tree.getSrcNamespace();
              String dst=tree.getDstNamespaces().get(0);
              TinyRemapper remapper=TinyRemapper.newRemapper()
                .withMappings(TinyUtils.createMappingProvider(tree, src, dst))
                .rebuildSourceFilenames(true).build();
              OutputConsumerPath consumer=new OutputConsumerPath.Builder(output).build();
              try {
                remapper.readInputs(input);
                remapper.apply(consumer);
              } finally {
                consumer.close();
                remapper.finish();
              }
            }
          }
          EOF
          javac -cp tools/tiny-remapper.jar:tools/mapping-io.jar tools/Remap.java

      - name: Remap Forge mod to Mojang names
        run: |
          java -cp tools/tiny-remapper.jar:tools/mapping-io.jar:tools Remap \
            original-mod/education_edition_reforged-1.0.4-forge-1.20.1.jar \
            tools/client.txt tools/server.txt \
            original-mod/education_edition_reforged-1.0.4-mojmap.jar

      - name: Decompile remapped mod
        run: |
          rm -rf decompiled
          mkdir -p decompiled
          java -Xmx2G -jar tools/cfr.jar original-mod/education_edition_reforged-1.0.4-named.jar \
            --outputdir decompiled --silent true --comments false

      - name: Build Fabric project
        run: gradle build

      - name: Upload decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: forge-decompiled-sources
          path: decompiled/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: education-edition-refabric
          path: build/libs/*.jar
