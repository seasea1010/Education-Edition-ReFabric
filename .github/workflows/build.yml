name: Build Fabric Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch original Forge mod
        run: |
          mkdir -p tools original-mod decompiled
          curl -L --fail -o original-mod/education_edition_reforged-1.0.4-forge-1.20.1.jar \
            https://api.modrinth.com/maven/maven.modrinth/AgZRfe77/yBO7DeLq/AgZRfe77-yBO7DeLq.jar
          curl -L --fail -o tools/cfr.jar \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

      - name: Decompile original Forge mod
        run: |
          java -Xmx2G -jar tools/cfr.jar original-mod/education_edition_reforged-1.0.4-forge-1.20.1.jar \
            --outputdir decompiled --silent true --comments false

      - name: Build Fabric project
        run: gradle build

      - name: Upload decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: forge-decompiled-sources
          path: decompiled/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: education-edition-refabric
          path: build/libs/*.jar
